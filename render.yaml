# render.yaml — Blueprint COMPAS (STACK v1.1.2 §6, F-37)
# Regla F-01: el servicio web NUNCA arranca el scheduler (RUN_SCHEDULER=false);
# los jobs financieros viven SOLO en el worker compas-jobs (1 instancia).
# Producción NO auto-despliega: deploy por tag v* vía GitHub Actions con required reviewer (Iván).

services:
  # ── API de producción ─────────────────────────────────────────────
  - type: web
    name: compas-api
    runtime: python
    plan: free                  # DEV: $0 (Free duerme por inactividad). Subir a 'standard' (2GB) en go-live — STACK §5
    region: ohio            # heredada de SISMO (servicios roddos-* en Ohio)
    branch: main
    autoDeploy: true            # FASE DESARROLLO (decisión CEO): push a main = vivo. En GO-LIVE volver a false + tag v* + reviewer (F-32) y reactivar compas-api-stg.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: honra X-Forwarded-* del edge. La IP real del cliente se lee en
    # código vía CF-Connecting-IP (Kimi L2); el origen DEBE quedar restringido a IPs de
    # Cloudflare (RUNBOOK §5) para que ese header no sea spoofeable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers
    healthCheckPath: /api/v1/health/ready  # F-03 (auditoría 2026-09-02): readiness
                                           # honesto — devuelve 503 si Beanie no
                                           # inicializó. /health (liveness) sigue
                                           # existiendo pero Render usa esta ruta
                                           # para decidir si reinicia; con eso la
                                           # próxima degradación silenciosa de Mongo
                                           # SE DETECTA y el servicio se reinicia,
                                           # no queda 30 días en 200 mintiendo.
    envVars:
      - key: PYTHON_VERSION      # PIN de Python (2026-09-01): sin esto Render pica su
                                 # default actual (3.14.3), que cuelga el startup de
                                 # FastAPI en algo del stack beanie 2 + motor 3.7 +
                                 # pymongo 4.17 + starlette 1.6. PR #145 intentó pinear
                                 # con backend/runtime.txt pero Render lo ignoró
                                 # silenciosamente (log dice "Using Python version 3.14.3
                                 # (default)"). El env var SÍ funciona — es lo que
                                 # documenta Render como mecanismo actual.
        value: "3.12.7"
      - key: RUN_SCHEDULER
        value: "false"          # NUNCA true en el web (F-01)
      - key: APP_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: MONGODB_URI_COMPAS
        sync: false             # secreto — se carga a mano (RUNBOOK §8)
      - key: MONGODB_URI_AUDIT  # usuario compas_audit (audit_writer); fail-fast C-01 sin él
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENC_KEY        # Fernet urlsafe-b64 32B — cifra el secreto TOTP (DoD #11)
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false

  # ── Worker de jobs financieros (F-01) — DIFERIDO a Sprint 5-6 ─────────────
  # No hay jobs todavía (el scheduler y sus 8 jobs llegan en Sprint 5-6). Render NO ofrece plan Free
  # para workers, así que crearlo ahora costaría ~$7/mes sin uso. Se RE-HABILITA (Starter) cuando
  # existan los jobs. Config preservada, comentada:
  # - type: worker
  #   name: compas-jobs
  #   runtime: python
  #   plan: starter               # 1 instancia SIEMPRE — jamás escalar horizontalmente
  #   region: ohio
  #   branch: main
  #   autoDeploy: false
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python -m app.jobs.scheduler
  #   envVars:
  #     - key: RUN_SCHEDULER
  #       value: "true"           # SOLO aquí
  #     - key: APP_ENV
  #       value: production
  #     - key: TZ
  #       value: America/Bogota   # el job de las 8:30 depende de esta TZ
  #     - key: MONGODB_URI_COMPAS
  #       sync: false
  #     - key: MONGODB_URI_AUDIT   # el worker también emite eventos de auditoría (§8)
  #       sync: false
  #     - key: JWT_SECRET
  #       sync: false
  #     - key: SENTRY_DSN
  #       sync: false
  #     - key: AWS_ACCESS_KEY_ID
  #       sync: false
  #     - key: AWS_SECRET_ACCESS_KEY
  #       sync: false
  #     - key: S3_BUCKET
  #       sync: false
  #     - key: BETTER_STACK_HEARTBEATS   # 8 URLs, una por job (RUNBOOK §7)
  #       sync: false

  # ── Staging — DIFERIDO a GO-LIVE (decisión CEO: fase desarrollo = UN solo entorno) ──
  # Mientras desarrollamos hay un único entorno: `compas-api` (auto-deploy desde main)
  # contra la base `compas`. En go-live se reactiva este servicio de staging (auto-deploy
  # desde main) y `compas-api` pasa a tag v* + reviewer. La config previa (compas-api-stg →
  # compas_stg) queda en el historial de git; es un paso de go-live, no algo descartado.

# Nota: el frontend (proyecto 'compas') vive en Vercel, no en este blueprint.
# Nota: no hay Render Cron Jobs — toda la programación vive en APScheduler dentro de compas-jobs
# para mantener jobstore en Mongo, catch-up e idempotencia (STACK §2).
