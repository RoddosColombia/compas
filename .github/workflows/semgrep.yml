# G-SEMGREP · COMPAS 2.0 Fundacional §5. Un PR que rompa CLAUDE.md
# (Decimal, audit_log append-only, RBAC en toda ruta) NO puede mergearse.

name: G-SEMGREP

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: reglas inviolables (CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: instalar semgrep
        run: pip install "semgrep>=1.90,<2"
      - name: correr .semgrep.yml (falla el PR ante cualquier ERROR)
        run: semgrep --config .semgrep.yml --error --strict --disable-version-check
